<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:H;src:url(Montserrat-ExtraBold.ttf)} @font-face{font-family:A;src:url(DMSerifDisplay-Regular.ttf)}
body{margin:0;background:transparent;display:flex;flex-wrap:wrap;gap:60px;padding:40px;width:1500px}
.s{display:inline-block;padding:20px}
.badge{position:relative;font-family:H;color:#E7E1DB;background:#961D1D;border:7px solid #fff;border-radius:999px;padding:18px 34px;font-size:46px;box-shadow:0 12px 26px rgba(0,0,0,.3);white-space:nowrap}
.cream{background:#E7E1DB;color:#961D1D} .earth{background:#8F6656;color:#fff}
.e{font-family:'Noto Color Emoji';margin-right:10px}
.x{text-decoration:line-through;text-decoration-thickness:7px;text-decoration-color:#961D1D}
.tape:before{content:"";position:absolute;top:-16px;left:50%;width:120px;height:34px;margin-left:-60px;background:rgba(250,236,170,.9);transform:rotate(-4deg)}
.hero{display:flex;flex-direction:column;align-items:center}
.hero .big{font-family:'Noto Color Emoji';font-size:190px;line-height:1;filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.hero .badge{margin-top:-20px;font-size:44px}
.emo{font-family:'Noto Color Emoji';font-size:150px;line-height:1;filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.label{font-family:A;font-size:84px;color:#961D1D;background:#E7E1DB;border:7px solid #fff;border-radius:28px;padding:10px 38px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.label .e{font-size:76px}
</style></head><body>
<div class="s" id="no_perfil"><div class="badge cream tape"><span class="e">❌</span><span class="x">perfil perfecto</span></div></div>
<div class="s" id="no_logo"><div class="badge cream tape"><span class="e">❌</span><span class="x">logo</span></div></div>
<div class="s" id="no_cosas"><div class="badge cream tape"><span class="e">❌</span><span class="x">mil cosas</span></div></div>
<div class="s" id="belleza"><div class="label tape"><span class="e">💄</span>belleza</div></div>
<div class="s" id="hogar"><div class="label tape"><span class="e">🏠</span>hogar</div></div>
<div class="s" id="hero"><div class="hero"><div class="big">🦸‍♀️</div><div class="badge">mamá, no superheroína <span class="e" style="margin:0 0 0 8px">😅</span></div></div></div>
<div class="s" id="semana"><div class="badge earth tape"><span class="e">🎥</span>1 vídeo a la semana</div></div>
<div class="s" id="heroemo"><div class="emo" style="font-size:230px">🦸‍♀️</div></div>
<div class="s" id="herobadge"><div class="badge tape">mamá, no superheroína <span class="e" style="margin:0 0 0 8px">😅</span></div></div>
<div class="s" id="chat"><div class="emo">💬</div></div>
<div class="s" id="sparkles"><div class="emo">✨</div></div>
<div class="s" id="phone"><div class="emo">📱</div></div>
</body></html>
