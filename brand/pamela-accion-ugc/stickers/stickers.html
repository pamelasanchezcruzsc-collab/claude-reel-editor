<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:H;src:url(Montserrat-ExtraBold.ttf)} @font-face{font-family:B;src:url(Poppins-SemiBold.ttf)} @font-face{font-family:A;src:url(DMSerifDisplay-Regular.ttf)}
body{margin:0;background:transparent;display:flex;flex-wrap:wrap;gap:60px;padding:40px;width:1400px}
.s{display:inline-block;padding:18px}
.emo{font-family:'Noto Color Emoji';font-size:150px;line-height:1;filter:drop-shadow(0 0 0 #fff) drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.badge{font-family:H;color:#E7E1DB;background:#961D1D;border:7px solid #fff;border-radius:999px;padding:18px 34px;font-size:46px;box-shadow:0 12px 26px rgba(0,0,0,.3);white-space:nowrap}
.badge.cream{background:#E7E1DB;color:#961D1D}
.badge .e{font-family:'Noto Color Emoji';margin-right:10px}
.tape{position:relative}
.tape:before{content:"";position:absolute;top:-14px;left:50%;width:120px;height:34px;margin-left:-60px;background:rgba(250,236,170,.85);transform:rotate(-4deg);z-index:2}
.strip{background:#1d1d1f;border:7px solid #fff;border-radius:26px;padding:16px;display:flex;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.strip .c{position:relative;width:150px;height:190px;border-radius:10px;overflow:hidden;border:4px solid #E7E1DB}
.strip .c img{width:100%;height:100%;object-fit:cover}
.strip .c.sel{border-color:#961D1D;border-width:6px}
.strip .c.sel:before,.strip .c.sel:after{content:"";position:absolute;top:0;bottom:0;width:14px;background:#961D1D;z-index:2}
.strip .c.sel:before{left:0}.strip .c.sel:after{right:0}
.igtext{font-family:B;font-size:50px;background:#fff;color:#111;border-radius:22px;padding:16px 26px;text-align:center;line-height:1.15;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.step{font-family:H;font-size:30px;color:#fff;background:#964B53;border:6px solid #fff;border-radius:50%;width:130px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 10px 22px rgba(0,0,0,.3)}
.step b{font-size:66px;margin-top:2px}
</style></head><body>
<div class="s" id="phone"><div class="emo">📱</div></div>
<div class="s" id="scissors"><div class="emo">✂️</div></div>
<div class="s" id="point"><div class="emo">👇</div></div>
<div class="s" id="sparkles"><div class="emo">✨</div></div>
<div class="s" id="chat"><div class="emo">💬</div></div>
<div class="s" id="film"><div class="emo">🎬</div></div>
<div class="s" id="heart"><div class="emo">🤍</div></div>
<div class="s" id="noapp"><div class="badge tape"><span class="e">🚫</span>0 apps nuevas</div></div>
<div class="s" id="listo"><div class="badge cream tape"><span class="e">✅</span>¡listo!</div></div>
<div class="s" id="descarga"><div class="badge"><span class="e">📥</span>se guarda en tu móvil</div></div>
<div class="s" id="tres"><div class="badge cream"><span class="e">🎞️</span>3 vídeos</div></div>
<div class="s" id="strip"><div class="strip tape"><div class="c"><img src="th1.jpg"></div><div class="c sel"><img src="th2.jpg"></div><div class="c"><img src="th3.jpg"></div></div></div>
<div class="s" id="igtext"><div class="igtext">3 cosas que me gustan<br>de este producto</div></div>
<div class="s" id="p1"><div class="step">paso<b>1</b></div></div>
<div class="s" id="p2"><div class="step">paso<b>2</b></div></div>
<div class="s" id="p3"><div class="step">paso<b>3</b></div></div>
</body></html>
